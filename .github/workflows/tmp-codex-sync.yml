name: Temporary hosted web search degradation validation

on:
  pull_request:
    branches:
      - sync/merge-runner-20260818

permissions:
  contents: write

jobs:
  websearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare hosted web search degradation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex-compat
          git checkout -B codex-compat-websearch-degrade origin/codex-compat

          python3 - <<'PY'
          from pathlib import Path

          server = Path('tools/server/server-chat.cpp')
          text = server.read_text()
          old = '''            if (type == "web_search") {
                register_tool_kind("web_search", false);
                json chatcmpl_web_search_tool;
                chatcmpl_web_search_tool["type"] = "function";
                chatcmpl_web_search_tool["function"] = {
                    {"name", "web_search"},
                    {"description", "Search the web"},
                    {"strict", true},
                    {"parameters", {
                        {"type", "object"},
                        {"properties", {{"query", {{"type", "string"}, {"description", "Search query"}}}}
                        },
                        {"required", json::array({"query"})}
                    }}
                };
                chatcmpl_tools.push_back(chatcmpl_web_search_tool);
                continue;
            }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one web_search compatibility block, found {text.count(old)}')
          server.write_text(text.replace(old, ''))

          tests = Path('tests/test-chat.cpp')
          text = tests.read_text()
          old = '''        assert_equals(true, result.contains("tools"));
        assert_equals(true, result.at("tools").is_array());
        assert_equals((size_t)2, result.at("tools").size());

        const auto & web_search_tool = result.at("tools")[0];
        assert_equals(std::string("function"), web_search_tool.at("type").get<std::string>());
        assert_equals(std::string("web_search"), web_search_tool.at("function").at("name").get<std::string>());

        const auto & weather_tool = result.at("tools")[1];
'''
          new = '''        assert_equals(true, result.contains("tools"));
        assert_equals(true, result.at("tools").is_array());
        assert_equals((size_t)1, result.at("tools").size());

        const auto & weather_tool = result.at("tools")[0];
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one mixed web_search/function assertion block, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''        assert_equals(true, result.contains("tools"));
        assert_equals((size_t)1, result.at("tools").size());
        assert_equals(std::string("web_search"),
            result.at("tools")[0].at("function").at("name").get<std::string>());
'''
          new = '''        assert_equals(false, result.contains("tools"));
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one unsupported-only web_search assertion block, found {text.count(old)}')
          tests.write_text(text.replace(old, new))
          PY

          git diff --check
          ! grep -n 'register_tool_kind("web_search"' tools/server/server-chat.cpp
          git add tools/server/server-chat.cpp tests/test-chat.cpp
          git diff --cached --check
          git commit -m "server: gracefully ignore hosted Responses web search"

      - name: Configure focused regression build
        shell: bash
        run: |
          cmake -S . -B build-websearch -G Ninja \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build compatibility targets
        shell: bash
        run: |
          cmake --build build-websearch --target \
            test-qwen38-codex-template \
            test-chat \
            llama-server \
            -j 2

      - name: Run Qwen Codex regression
        shell: bash
        run: ./build-websearch/bin/test-qwen38-codex-template

      - name: Run chat regression suite
        shell: bash
        run: ./build-websearch/bin/test-chat

      - name: Verify final delta
        shell: bash
        run: |
          git diff --check origin/codex-compat...HEAD
          test "$(git diff --name-only origin/codex-compat...HEAD | sort)" = $'tests/test-chat.cpp\ntools/server/server-chat.cpp'

      - name: Publish validated web search branch
        shell: bash
        run: git push --force origin HEAD:refs/heads/codex-compat-websearch-degrade
