name: Temporary hosted web search degradation validation

on:
  pull_request:
    branches:
      - sync/merge-runner-20260818

permissions:
  contents: write

jobs:
  websearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare hosted web search degradation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex-compat
          git checkout -B codex-compat-websearch-degrade origin/codex-compat

          python3 - <<'PY'
          from pathlib import Path

          server = Path("tools/server/server-chat.cpp")
          text = server.read_text()
          marker = '            if (type == "web_search") {'
          next_marker = '            if (type == "custom") {'
          if text.count(marker) != 1 or text.count(next_marker) != 1:
              raise SystemExit("unexpected Responses tool conversion layout")
          start = text.index(marker)
          end = text.index(next_marker, start)
          server.write_text(text[:start] + text[end:])

          tests = Path("tests/test-chat.cpp")
          text = tests.read_text()

          web_tool = '        const auto & web_search_tool = result.at("tools")[0];\n'
          weather_tool = '        const auto & weather_tool = result.at("tools")[1];\n'
          if text.count(web_tool) != 1 or text.count(weather_tool) != 1:
              raise SystemExit("unexpected mixed web_search/function regression layout")
          start = text.index(web_tool)
          end = text.index(weather_tool, start) + len(weather_tool)
          text = text[:start] + '        const auto & weather_tool = result.at("tools")[0];\n' + text[end:]

          mixed_size = '        assert_equals((size_t)2, result.at("tools").size());\n\n        const auto & weather_tool = result.at("tools")[0];\n'
          mixed_size_new = '        assert_equals((size_t)1, result.at("tools").size());\n\n        const auto & weather_tool = result.at("tools")[0];\n'
          if text.count(mixed_size) != 1:
              raise SystemExit("unexpected mixed web_search/function size assertion")
          text = text.replace(mixed_size, mixed_size_new, 1)

          web_assert = '        assert_equals(std::string("web_search"),\n            result.at("tools")[0].at("function").at("name").get<std::string>());\n'
          if text.count(web_assert) != 1:
              raise SystemExit("unexpected unsupported-only web_search regression layout")
          pos = text.index(web_assert)
          block_start_marker = '        assert_equals(true, result.contains("tools"));\n'
          block_start = text.rfind(block_start_marker, 0, pos)
          if block_start < 0:
              raise SystemExit("web_search-only tools assertion start not found")
          block_end = pos + len(web_assert)
          text = text[:block_start] + '        assert_equals(false, result.contains("tools"));\n' + text[block_end:]

          if "web_search_tool" in text:
              raise SystemExit("stale synthetic web_search regression remains")
          tests.write_text(text)
          PY

          git diff --check
          ! grep -n 'register_tool_kind("web_search"' tools/server/server-chat.cpp
          git add tools/server/server-chat.cpp tests/test-chat.cpp
          git diff --cached --check
          git commit -m "server: gracefully ignore hosted Responses web search"

      - name: Configure focused regression build
        shell: bash
        run: |
          cmake -S . -B build-websearch -G Ninja \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build compatibility targets
        shell: bash
        run: |
          cmake --build build-websearch --target \
            test-qwen38-codex-template \
            test-chat \
            llama-server \
            -j 2

      - name: Run Qwen Codex regression
        shell: bash
        run: ./build-websearch/bin/test-qwen38-codex-template

      - name: Run chat regression suite
        shell: bash
        run: ./build-websearch/bin/test-chat

      - name: Verify final delta
        shell: bash
        run: |
          git diff --check origin/codex-compat...HEAD
          test "$(git diff --name-only origin/codex-compat...HEAD | sort)" = $'tests/test-chat.cpp\ntools/server/server-chat.cpp'

      - name: Publish validated web search branch
        shell: bash
        run: git push --force origin HEAD:refs/heads/codex-compat-websearch-degrade
