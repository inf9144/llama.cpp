name: Add apply_patch EOF guidance

'on':
  push:
    branches: [codex-compat]
    paths:
      - ".github/workflows/tmp-add-apply-patch-eof-guidance.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-compat
          fetch-depth: 0
      - name: Apply patch and sanity-check diff
        run: |
          python3 tmp_add_apply_patch_eof_guidance.py
          git diff --check
          git diff -- tools/server/server-chat.cpp tests/test-qwen38-codex-template.cpp
      - name: Commit target files
        run: |
          git config user.name "Codex Lab"
          git config user.email "2657841+inf9144@users.noreply.github.com"
          git add tools/server/server-chat.cpp tests/test-qwen38-codex-template.cpp
          git commit -m "server: document apply_patch EOF append shortcut"
          git push origin HEAD:codex-compat
