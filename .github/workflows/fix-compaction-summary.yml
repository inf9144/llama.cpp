name: Fix and verify compaction summary

on:
  push:
    branches:
      - codex-compat

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-compat
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix_compaction.py
          python3 /tmp/fix_compaction.py
          git diff --check

      - name: Configure CPU-only server build
        run: cmake -S . -B build-ci -DGGML_NATIVE=OFF -DGGML_VULKAN=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build llama-server
        run: cmake --build build-ci --target llama-server -j2

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add models/templates/llama-cpp-qwen3.8-codex.jinja tools/server/server-task.cpp
          git commit -m 'server: make Responses compaction summaries robust'
          git push origin HEAD:codex-compat
