name: Verify Responses compaction patch

on:
  push:
    branches: [codex-compat]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-compat
          fetch-depth: 0

      - name: Install Qwen3.8 Codex template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = ''''''
          out = Path('models/templates/llama-cpp-qwen3.8-codex.jinja')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(gzip.decompress(base64.b64decode(payload)))
          print(f'wrote {out} ({out.stat().st_size} bytes)')
          PY
          git diff --check

      - name: Configure CPU-only server build
        run: >-
          cmake -S . -B build
          -DGGML_NATIVE=OFF
          -DGGML_VULKAN=OFF
          -DGGML_CUDA=OFF
          -DGGML_HIP=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_SERVER=ON

      - name: Build llama-server
        run: cmake --build build --target llama-server -j2

      - name: Commit verified template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add models/templates/llama-cpp-qwen3.8-codex.jinja
          if git diff --cached --quiet; then
            echo 'Template already committed'
            exit 0
          fi
          git commit -m 'models: add Qwen3.8 Codex chat template'
          git push origin HEAD:codex-compat
